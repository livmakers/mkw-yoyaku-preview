<body class="admin">
<div class="admin-wrap">
  <div style="max-width:420px;margin:8vh auto 0" class="bg-yagasuri">
    <div class="admin-card" style="padding:28px">
      <h1 style="text-align:center">三河屋 予約管理</h1>
      <p class="field-note" style="text-align:center">※プレビュー版。ボタンでダッシュボードのサンプルへ進めます</p>
      <div class="field">
        <label for="l-id">ログインID</label>
        <input type="text" id="l-id" autocomplete="username" placeholder="mkw-owner">
      </div>
      <div class="field">
        <label for="l-pw">パスワード</label>
        <input type="password" id="l-pw" autocomplete="current-password" placeholder="••••••••">
      </div>
      <a class="btn btn--primary btn--block" href="admin.html">ログイン</a>
      <p class="field-note" style="margin-top:12px">5回連続で失敗すると15分間ロックされます。<br>権限: owner(全機能)／manager(全機能)／staff(自店舗の受注のみ)</p>
    </div>
    <p style="text-align:center;margin-top:16px">
      <a class="btn btn--ghost" href="index.html">← 予約サイトへ戻る</a>
    </p>
  </div>
</div>
