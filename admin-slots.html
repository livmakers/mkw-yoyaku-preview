<body class="admin">
<header class="admin-header">
  <div class="admin-header__inner">
    <a class="admin-header__brand" href="admin.html">三河屋 予約管理</a>
    <nav class="admin-nav" aria-label="管理メニュー">

  </div>
</header>
<div class="admin-wrap">
<h1>受取枠の上限設定</h1>
<div class="admin-card">
  <h2>曜日パターン一括設定</h2>
  <div class="filter-bar">
    <div class="field"><label>期間 From</label><input type="date" value="2026-08-01"></div>
    <div class="field"><label>期間 To</label><input type="date" value="2026-08-31"></div>
    <div class="field"><label>1枠の受付上限(件)</label><input type="number" value="10"></div>
  </div>
  <div class="field"><label>曜日</label>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <label style="font-weight:400"><input type="checkbox" checked> 土</label>
      <label style="font-weight:400"><input type="checkbox" checked> 日</label>
      <label style="font-weight:400"><input type="checkbox"> 月</label>
      <label style="font-weight:400"><input type="checkbox"> 火</label>
      <label style="font-weight:400"><input type="checkbox"> 水</label>
      <label style="font-weight:400"><input type="checkbox"> 木</label>
      <label style="font-weight:400"><input type="checkbox"> 金</label>
    </div>
  </div>
  <div class="field"><label>時間帯(1行1枠)</label><textarea rows="4">10:00-12:00
12:00-14:00
14:00-16:00
16:00-18:00</textarea></div>
  <button type="button" class="btn btn--primary">一括設定する（プレビューでは無効）</button>
</div>
<div class="admin-card">
  <h2>枠の確認・個別調整（ビッグリブ小牧店 8月1日）</h2>
  <table class="admin-table">
    <tr><th>時間帯</th><th class="num">上限</th><th class="num">予約数</th><th class="num">残</th><th>操作</th></tr>
    <tr><td>10:00〜12:00</td><td class="num">10</td><td class="num">3</td><td class="num">7</td><td><button class="btn btn--ghost" style="min-height:32px;padding:0 10px;font-size:.8rem">変更</button></td></tr>
    <tr><td>12:00〜14:00</td><td class="num">10</td><td class="num">6</td><td class="num">4</td><td><button class="btn btn--ghost" style="min-height:32px;padding:0 10px;font-size:.8rem">変更</button></td></tr>
    <tr><td>14:00〜16:00</td><td class="num">10</td><td class="num">10</td><td class="num">0</td><td><button class="btn btn--ghost" style="min-height:32px;padding:0 10px;font-size:.8rem">変更</button></td></tr>
    <tr><td>16:00〜18:00</td><td class="num">10</td><td class="num">1</td><td class="num">9</td><td><button class="btn btn--ghost" style="min-height:32px;padding:0 10px;font-size:.8rem">変更</button></td></tr>
  </table>
</div>
</div>
<script>
document.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b || b.dataset.print !== undefined || b.dataset.step !== undefined) return;
  var old = document.querySelector('.demo-toast');
  if (old) old.remove();
  var t = document.createElement('div');
  t.className = 'demo-toast';
  t.textContent = 'デモ版のためこの操作は実行されません（本番の管理画面では動作します）';
  t.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1B1917;color:#fff;padding:12px 22px;border-radius:999px;z-index:99;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center';
  document.body.append(t);
  setTimeout(function(){ t.remove(); }, 2400);
});
</script>
</body>
</html>
